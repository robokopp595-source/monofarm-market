<!doctype html>
<html lang="ru">
<head>
  <link rel="apple-touch-icon" href="/5C31BC00-DEF0-4AF9-84B2-7F3FE3403027.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Товары продавцов</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f7f6;
  color:#17211e
}
.wrap{max-width:1050px;margin:auto;padding:20px}
.head{
  background:#087f5b;
  color:white;
  padding:24px;
  border-radius:16px;
  margin-bottom:15px
}
.head h1{margin:0 0 6px;font-size:30px}
.head p{margin:0;opacity:.9}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.05)
}
h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
input,select,button{
  width:100%;
  font-size:16px;
  padding:13px;
  border-radius:10px
}
input,select{border:1px solid #d7dfdc;background:#fff}
button{
  border:0;
  background:#087f5b;
  color:white;
  font-weight:650;
  cursor:pointer
}
button.secondary{background:#edf2f0;color:#24332e}
button.danger{background:#fff0f0;color:#b42318}
button:disabled{opacity:.55}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.toolbar input{flex:1}
.toolbar button{width:auto}
.authInfo{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between
}
.authInfo button{width:auto}
.status{
  display:none;
  padding:11px;
  border-radius:9px;
  margin-bottom:12px;
  background:#e9f7f1;
  color:#087f5b
}
.status.error{background:#fff0f0;color:#b42318}
.item{
  border:1px solid #e2e9e6;
  border-radius:12px;
  padding:15px;
  margin-top:10px
}
.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.name{font-size:19px;font-weight:750}
.price{font-weight:750;color:#087f5b}
.meta{color:#65716d;margin-top:8px;line-height:1.55}
.actions{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;color:#77827e;padding:25px}
.hidden{display:none!important}

@media(max-width:650px){
  .wrap{padding:12px}
  .grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .toolbar button{width:100%}
  .item-top{flex-direction:column}
  .authInfo{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>
<div class="wrap">

<div class="head">
  <h1>Товары продавцов</h1>
  <p>Общая база цен и наличия товаров</p>
</div>

<div class="card" id="authCard">
  <h2>Вход продавца</h2>
  <div id="authStatus" class="status"></div>

  <div id="loggedOut">
    <div class="grid">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Пароль">
      <button id="login">Войти</button>
      <button id="signup" class="secondary">Регистрация</button>
    </div>
  </div>

  <div id="loggedIn" class="hidden">
    <div class="authInfo">
      <div>
        Вы вошли как:<br>
        <b id="userEmail"></b>
      </div>
      <button id="logout" class="secondary">Выйти</button>
    </div>
  </div>
</div>

<div class="card hidden" id="sellerPanel">
  <h2 id="formTitle">Добавить товар</h2>
  <div id="status" class="status"></div>

  <form id="form" class="grid">
    <input id="seller" placeholder="Продавец" required>
    
    <input id="product" placeholder="Название товара" required>

    <input id="price" type="number" min="0" step="0.01"
           placeholder="Цена" required>

    <select id="currency">
      <option value="UZS">Сум (UZS)</option>
      <option value="RUB">Рубль (RUB)</option>
      <option value="USD">Доллар (USD)</option>
      <option value="EUR">Евро (EUR)</option>
    </select>

    <input id="quantity" type="number" min="0"
           placeholder="Количество в наличии" required>
<input id="contact" type="tel" placeholder="Телефон продавца">
<input id="telegram" type="text" placeholder="Telegram username, например @username">
    
    


    <input id="image_file" type="file" accept="image/*">
    <button id="submit" type="submit">Добавить товар</button>
    <button id="cancel" type="button"
            class="secondary hidden">Отмена</button>
  </form>
</div>

<div class="card">
  <h2>Все товары</h2>

  <div class="toolbar">
    <input id="search" placeholder="Поиск по товару или продавцу">
    <button id="refresh">Обновить</button>
  </div>

  <div id="list"></div>
</div>

</div>

<script>
const SUPABASE_URL =
  'https://nyqolvdmvjgggwymtcmd.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_lSSMYizJ7qrXD8uVgoC_8Q_cPhdl49D';

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

let rows=[];
let editing=null;
let currentUser=null;

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function message(id,text,error=false){
  const e=$(id);
  e.textContent=text;
  e.className='status'+(error?' error':'');
  e.style.display='block';

  setTimeout(()=>{
    e.style.display='none';
  },4000);
}

async function updateAuth(){
  const {data:{user}}=await db.auth.getUser();

  currentUser=user;

  if(user){
    $('loggedOut').classList.add('hidden');
    $('loggedIn').classList.remove('hidden');
    $('sellerPanel').classList.remove('hidden');
    $('userEmail').textContent=user.email;
  }else{
    $('loggedOut').classList.remove('hidden');
    $('loggedIn').classList.add('hidden');
    $('sellerPanel').classList.add('hidden');
    editing=null;
  }

  render();
}

$('signup').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email || password.length<6){
    message('authStatus',
      'Введите email и пароль минимум из 6 символов',true);
    return;
  }

  const {error}=await db.auth.signUp({email,password});

  if(error){
    message('authStatus','Ошибка: '+error.message,true);
    return;
  }

  message('authStatus','Регистрация выполнена');
  await updateAuth();
};

$('login').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;

  const {error}=await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    message('authStatus','Ошибка входа: '+error.message,true);
    return;
  }

  $('password').value='';
  await updateAuth();
};

$('logout').onclick=async()=>{
  await db.auth.signOut();
  resetForm();
  await updateAuth();
};

async function load(){
  $('list').innerHTML=
    '<div class="empty">Загрузка...</div>';

  const {data,error}=await db
    .from('products')
    .select('*')
    .order('updated_at',{ascending:false});

  if(error){
    $('list').innerHTML=
      '<div class="empty">Ошибка: '+
      esc(error.message)+'</div>';
    return;
  }

  rows=data||[];
  render();
}

function render(){
  const q=$('search').value.trim().toLowerCase();

  const filtered=rows.filter(x=>
    ((x.product_name||'')+' '+(x.seller||''))
      .toLowerCase().includes(q)
  );

  if(!filtered.length){
    $('list').innerHTML=
      '<div class="empty">Товары не найдены</div>';
    return;
  }

  $('list').innerHTML=filtered.map(x=>{
    const mine=
      currentUser &&
      x.user_id===currentUser.id;
    const isAdmin = currentUser && currentUser.id === '483f909e-74b4-4c60-b23c-a77a57d0f541';

    return `
      <div class="item">
        <div class="item-top">
          <div class="name">${esc(x.product_name)}</div>
          <div class="price">
            ${esc(x.price)} ${esc(x.currency)}
          </div>
        </div>

        ${x.image_url ? `<img src="${esc(x.image_url)}" alt="${esc(x.product_name)}" style="width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin:10px 0;">` : ''}<div class="meta">
  <b>Продавец:</b> <a href="#" onclick="showSellerProfile('${x.user_id}');return false;">${esc(x.seller)}</a><br>
  <b>В наличии:</b> ${esc(x.quantity)} шт.<br>
  <b>Телефон:</b> ${esc(x.contact || 'Не указан')}<br>
<b>Telegram:</b> ${esc(x.telegram || 'Не указан')}
  ${x.contact ? `<a href="tel:${x.contact.trim().replace(/[^+\d]/g,'')}">Позвонить</a>` : ''} ${x.telegram ? `<a href="https://t.me/${x.telegram.trim().replace(/^@/,'')}" target="_blank">Telegram</a>` : ''}
</div>

        ${mine || isAdmin ? `
          <div class="actions">
            <button class="secondary"
              onclick="editRow('${x.id}')">
              Изменить
            </button>

            <button class="danger"
              onclick="removeRow('${x.id}')">
              Удалить
            </button>
            ${isAdmin && x.user_id !== currentUser.id ? `
<button class="danger" onclick="blockSeller('${x.user_id}')">
  Заблокировать продавца
</button>
` : ''}
          </div>
        `:''}
      </div>
    `;
  }).join('');
}
function showSellerProfile(userId){
  const sellerProducts = rows.filter(r => r.user_id === userId);

  if(!sellerProducts.length) return;

  const seller = sellerProducts[0];

  $('list').innerHTML = `
    <div class="item">
      <div class="name">${esc(seller.seller)}</div>
      <div class="meta">
        <b>Телефон:</b> ${esc(seller.contact || 'Не указан')}<br>
        <b>Telegram:</b> ${esc(seller.telegram || 'Не указан')}<br><br>
        <b>Товаров продавца:</b> ${sellerProducts.length}
      </div>
      <br>
      <button onclick="render()">← Вернуться ко всем товарам</button>
    </div>
  ` + sellerProducts.map(x => `
    <div class="item">
      <div class="name">${esc(x.product_name)}</div>
      <div class="price">${esc(x.price)} ${esc(x.currency)}</div>
      ${x.image_url ? `<img src="${esc(x.image_url)}" alt="${esc(x.product_name)}" style="width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin:10px 0;">` : ''}
      <div class="meta">
        <b>В наличии:</b> ${esc(x.quantity)} шт.
      </div>
    </div>
  `).join('');

  window.scrollTo({top:0,behavior:'smooth'});
}
$('form').onsubmit=async e=>{
  e.preventDefault();

  if(!currentUser){
    message('status','Сначала войдите в аккаунт',true);
    return;
  }

  let uploadedImageUrl = editing ? (rows.find(r => String(r.id) === String(editing))?.image_url || '') : '';

const imageFile = $('image_file').files[0];

if(imageFile){
  const ext = imageFile.name.split('.').pop();
  const fileName = `${currentUser.id}/${Date.now()}.${ext}`;

  const { error: uploadError } = await db.storage
    .from('product-images')
    .upload(fileName, imageFile);

  if(uploadError){
    message('status', 'Ошибка загрузки фото: ' + uploadError.message, true);
    return;
  }

  const { data: publicData } = db.storage
    .from('product-images')
    .getPublicUrl(fileName);

  uploadedImageUrl = publicData.publicUrl;
}const obj={
    seller:$('seller').value.trim(),
    product_name:$('product').value.trim(),
    price:Number($('price').value),
    currency:$('currency').value,
    quantity:Number($('quantity').value),
  contact:$('contact').value.trim(),
  telegram:$('telegram').value.trim(),
  image_url:uploadedImageUrl,
    user_id:currentUser.id,
    updated_at:new Date().toISOString()
  };

  let result;

  if(editing){
    result=await db
      .from('products')
      .update(obj)
      .eq('id',editing)
      .eq('user_id',currentUser.id);
  }else{
    result=await db
      .from('products')
      .insert(obj);
  }

  if(result.error){
    message('status',
      'Ошибка: '+result.error.message,true);
    return;
  }

  message(
    'status',
    editing?'Товар изменён':'Товар добавлен'
  );

  resetForm();
  await load();
};

function editRow(id){
  const x=rows.find(r=>String(r.id)===String(id));

  if(!x || !currentUser ||
     x.user_id!==currentUser.id) return;

  editing=x.id;

  $('seller').value=x.seller||'';
  $('product').value=x.product_name||'';
  $('price').value=x.price||'';
  $('currency').value=x.currency||'UZS';
  $('quantity').value=x.quantity||0;
  $('contact').value=x.contact||'';
$('telegram').value=x.telegram||'';
  
  $('formTitle').textContent='Изменить товар';
  $('submit').textContent='Сохранить';
  $('cancel').classList.remove('hidden');

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editing=null;
  $('form').reset();
  $('formTitle').textContent='Добавить товар';
  $('submit').textContent='Добавить товар';
  $('cancel').classList.add('hidden');
}
async function blockSeller(userId){
  if(!currentUser) return;

  if(!confirm('Заблокировать этого продавца?')) return;

  const {error} = await db
    .from('blocked_users')
    .insert({user_id:userId});

  if(error){
    alert('Ошибка: ' + error.message);
    return;
  }

  alert('Продавец заблокирован');
}
async function removeRow(id){
  if(!currentUser) return;

  if(!confirm('Удалить этот товар?')) return;

  const {error}=await db
    .from('products')
    .delete()
    .eq('id',id)
    

  if(error){
    alert('Ошибка: '+error.message);
    return;
  }

  await load();
}

$('cancel').onclick=resetForm;
$('search').oninput=render;
$('refresh').onclick=load;

db.auth.onAuthStateChange(()=>{
  setTimeout(updateAuth,0);
});

(async()=>{
  await updateAuth();
  await load();
})();
</script>

</body>
</html>
