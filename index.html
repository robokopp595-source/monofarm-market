<!doctype html>
<html lang="ru">
<head>
  <link rel="apple-touch-icon" href="/5C31BC00-DEF0-4AF9-84B2-7F3FE3403027.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Товары продавцов</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f7f6;
  color:#17211e
}
.wrap{max-width:1050px;margin:auto;padding:20px}
.head{
  background:#087f5b;
  color:white;
  padding:24px;
  border-radius:16px;
  margin-bottom:15px
}
.head h1{margin:0 0 6px;font-size:30px}
.head p{margin:0;opacity:.9}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.05)
}
h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
input,select,button{
  width:100%;
  font-size:16px;
  padding:13px;
  border-radius:10px
}
input,select{border:1px solid #d7dfdc;background:#fff}
button{
  border:0;
  background:#087f5b;
  color:white;
  font-weight:650;
  cursor:pointer
}
button.secondary{background:#edf2f0;color:#24332e}
button.danger{background:#fff0f0;color:#b42318}
button:disabled{opacity:.55}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.toolbar input{flex:1}
.toolbar button{width:auto}
.authInfo{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between
}
.authInfo button{width:auto}
.status{
  display:none;
  padding:11px;
  border-radius:9px;
  margin-bottom:12px;
  background:#e9f7f1;
  color:#087f5b
}
.status.error{background:#fff0f0;color:#b42318}
.item{
  border:1px solid #e2e9e6;
  border-radius:12px;
  padding:15px;
  margin-top:10px
}
.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.name{font-size:19px;font-weight:750}
.price{font-weight:750;color:#087f5b}
.meta{color:#65716d;margin-top:8px;line-height:1.55}
.actions{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;color:#77827e;padding:25px}
.hidden{display:none!important}

@media(max-width:650px){
  .wrap{padding:12px}
  .grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .toolbar button{width:100%}
  .item-top{flex-direction:column}
  .authInfo{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>
<div class="wrap">

<div class="head">
  <h1>Товары продавцов</h1>
  <p>Общая база цен и наличия товаров</p>
</div>
  <div id="adminAnalytics" class="card hidden">
  <h2>📊 Аналитика сайта</h2>
  <div id="analyticsContent">Загрузка статистики...</div>
</div>
<button type="button" onclick="document.getElementById('authCard').classList.toggle('hidden')">
🔐 Вход продавца
</button>
<div class="card hidden" id="authCard">
  <h2>Вход продавца</h2>
  <div id="authStatus" class="status"></div>

  <div id="loggedOut">
    <div class="grid">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Пароль">
      <button id="login">Войти</button>
      <button id="signup" class="secondary">Регистрация</button>
    </div>
  </div>

  <div id="loggedIn" class="hidden">
    <div class="authInfo">
      <div>
        Вы вошли как:<br>
        <b id="userEmail"></b>
      </div>
      <button id="logout" class="secondary">Выйти</button>
      <button id="sellerProfileBtn" type="button" class="secondary">👤 Мои контакты</button>
      <div id="sellerProfileForm" class="hidden" style="margin-top:10px;">
  <input id="profileName" type="text" placeholder="Имя продавца">
  <input id="profileContact" type="tel" placeholder="Телефон, например +998901234567">
  <input id="profileTelegram" type="text" placeholder="Telegram, например @username">
  <button id="saveSellerProfile" type="button">Сохранить контакты</button>
</div>
    </div>
  </div>
</div>
<div style="margin:15px 0;"><img src="/96247B07-B05E-47B3-A74F-F1484EC78162.png" style="width:100%;display:block;border-radius:16px;"></div>
  <button style="display:none;" type="button" id="toggleSellerPanel" onclick="toggleSellerPanel()">➕ Добавить товар</button>
<div class="card hidden" id="sellerPanel">
  <h2 id="formTitle">Добавить товар</h2>
  <div id="status" class="status"></div>

  <form id="form" class="grid">
    <input id="seller" placeholder="Продавец" required>
    
    <input id="product" placeholder="Название товара" required>

    
      

    
      
      
      
    
  

  
          
<input id="contact" type="tel" placeholder="Телефон продавца">
<input id="telegram" type="text" placeholder="Telegram username, например @username">
    
    


    <input id="image_file" type="file" accept="image/*">
    <button id="submit" type="submit">Добавить товар</button>
    <button id="cancel" type="button"
            class="secondary hidden">Отмена</button>
 <button type="button" onclick="showInstallHelp()">📲 Установить на главный экран</button></form>
</div>

<div class="card">
  <h2>Все товары</h2>

  <div class="toolbar">
    <input id="search" placeholder="Поиск по товару или продавцу">
    <button id="refresh">Обновить</button>
  </div>

  <div id="list"></div>
</div>

</div>

<script>
const SUPABASE_URL =
  'https://nyqolvdmvjgggwymtcmd.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_lSSMYizJ7qrXD8uVgoC_8Q_cPhdl49D';

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

let rows=[];
let editing=null;
let currentUser=null;

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function message(id,text,error=false){
  const e=$(id);
  e.textContent=text;
  e.className='status'+(error?' error':'');
  e.style.display='block';

  setTimeout(()=>{
    e.style.display='none';
  },4000);
}

async function updateAuth(){
  const {data:{user}}=await db.auth.getUser();

  currentUser=user;

  if(user){
    $('loggedOut').classList.add('hidden');
    $('loggedIn').classList.remove('hidden');
    
    $('userEmail').textContent=user.email;
    if (user.id === '483f909e-74b4-4c60-b23c-a77a57d0f541') {
      $('sellerPanel').classList.remove('hidden');
  $('adminAnalytics').classList.remove('hidden');
  await loadAnalytics();
} else {
  $('adminAnalytics').classList.add('hidden');
}
  }else{
    $('loggedOut').classList.remove('hidden');
    $('loggedIn').classList.add('hidden');
    $('sellerPanel').classList.add('hidden');
    editing=null;
  }

  render();
}

$('signup').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email || password.length<6){
    message('authStatus',
      'Введите email и пароль минимум из 6 символов',true);
    return;
  }

  const {error}=await db.auth.signUp({email,password});

  if(error){
    message('authStatus','Ошибка: '+error.message,true);
    return;
  }

  message('authStatus','Регистрация выполнена');
  await updateAuth();
};

$('login').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;

  const {error}=await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    message('authStatus','Ошибка входа: '+error.message,true);
    return;
  }

  $('password').value='';
  await updateAuth();
};

$('logout').onclick=async()=>{
  await db.auth.signOut();
  resetForm();
  await updateAuth();
};

async function load(){
  $('list').innerHTML=
    '<div class="empty">Загрузка...</div>';

  const {data,error}=await db
    .from('catalog')
    .select('*')
    .order('created_at', {ascending:false});
const { data: stockData, error: stockError } = await db
  .from('seller_stock')
  .select('*');

window.sellerStock = stockData || [];
  const { data: profilesData } = await db
  .from('seller_profiles')
  .select('*');

window.sellerProfiles = profilesData || [];
  if(error){
    $('list').innerHTML=
      '<div class="empty">Ошибка: '+
      esc(error.message)+'</div>';
    return;
  }

  rows=data||[];
  render();
}

function render(){
  const q=$('search').value.trim().toLowerCase();

  const filtered=rows.filter(x=>
  (x.name || '').toLowerCase().includes(q)
);
      
  

  if(!filtered.length){
    $('list').innerHTML=
      '<div class="empty">Товары не найдены</div>';
    return;
  }

  $('list').innerHTML=filtered.map(x=>{
    
      
    
    const isAdmin = currentUser && currentUser.id === '483f909e-74b4-4c60-b23c-a77a57d0f541';
const inStock = currentUser && (window.sellerStock || []).some(
  s => s.catalog_id === x.id && s.seller_id === currentUser.id
);
    const sellersInStock = (window.sellerStock || [])
  .filter(s => s.catalog_id === x.id)
  .map(s => (window.sellerProfiles || []).find(p => p.user_id === s.seller_id))
  .filter(Boolean);
    return `
      <div class="item">
        <div class="item-top">
          <div class="name">${esc(x.name)}</div>
          ${currentUser && !isAdmin ? `<button type="button" onclick="toggleStock('${x.id}')" style="background:${inStock ? '#16a34a' : '#e5e7eb'};color:${inStock ? 'white' : '#374151'};">${inStock ? '✓ В наличии' : 'Отметить наличие'}</button>` : ''}
            
        
        </div>

        ${x.image_url ? `<img src="${esc(x.image_url)}" alt="${esc(x.product_name)}" style="width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin:10px 0;">` : ''}<div class="meta">
  ${sellersInStock.length ? `
  <div style="margin-top:12px;">
    <b>🟢 В наличии у продавцов:</b>
    ${sellersInStock.map(p => `
      <div style="margin-top:8px;">
        <b>${esc(p.seller_name || 'Продавец')}</b><br>
        ${p.contact ? `📞 ${esc(p.contact)} <a href="https://wa.me/${p.contact.replace(/\D/g,'')}" target="_blank">WhatsApp</a><br>` : ''}
        ${p.telegram ? `Telegram: ${esc(p.telegram)}` : ''}
      </div>
    `).join('')}
  </div>
` : '<div style="margin-top:10px;">Нет продавцов с наличием</div>'}

        ${isAdmin ? `
          <div class="actions">
            <button class="secondary"
              onclick="editRow('${x.id}')">
              Изменить
            </button>

            <button class="danger"
              onclick="removeRow('${x.id}')">
              Удалить
            </button>
            ${isAdmin && x.user_id !== currentUser.id ? `
<button class="danger" onclick="blockSeller('${x.user_id}')">
  Заблокировать продавца
</button>
` : ''}
          </div>
        `:''}
      </div>
    `;
  }).join('');
}
function showSellerProfile(userId){
  const sellerProducts = rows.filter(r => r.user_id === userId);

  if(!sellerProducts.length) return;

  const seller = sellerProducts[0];

  $('list').innerHTML = `
    <div class="item">
      <div class="name">${esc(seller.seller)}</div>
      <div class="meta">
        <b>Телефон:</b> ${esc(seller.contact || 'Не указан')}<br>
        <b>Telegram:</b> ${esc(seller.telegram || 'Не указан')}<br><br>
        <b>Товаров продавца:</b> ${sellerProducts.length}
      </div>
      <br>
      <button onclick="render()">← Вернуться ко всем товарам</button>
    </div>
  ` + sellerProducts.map(x => `
    <div class="item">
      <div class="name">${esc(x.product_name)}</div>
      <div class="price">${esc(x.price)} ${esc(x.currency)}</div>
      ${x.image_url ? `<img src="${esc(x.image_url)}" alt="${esc(x.product_name)}" style="width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin:10px 0;">` : ''}
      <div class="meta">
        <b>В наличии:</b> ${esc(x.quantity)} шт.
      </div>
    </div>
  `).join('');

  window.scrollTo({top:0,behavior:'smooth'});
}
$('form').onsubmit=async e=>{
  e.preventDefault();

  if(!currentUser){
    message('status','Сначала войдите в аккаунт',true);
    return;
  }

  let uploadedImageUrl = editing ? (rows.find(r => String(r.id) === String(editing))?.image_url || '') : '';

const imageFile = $('image_file').files[0];

if(imageFile){
  const ext = imageFile.name.split('.').pop();
  const fileName = `${currentUser.id}/${Date.now()}.${ext}`;

  const { error: uploadError } = await db.storage
    .from('product-images')
    .upload(fileName, imageFile);

  if(uploadError){
    message('status', 'Ошибка загрузки фото: ' + uploadError.message, true);
    return;
  }

  const { data: publicData } = db.storage
    .from('product-images')
    .getPublicUrl(fileName);

  uploadedImageUrl = publicData.publicUrl;
}const obj={
    seller:$('seller').value.trim(),
    product_name:$('product').value.trim(),
    
    
    
  contact:$('contact').value.trim(),
  telegram:$('telegram').value.trim(),
  image_url:uploadedImageUrl,
    user_id:currentUser.id,
    updated_at:new Date().toISOString()
  };
localStorage.setItem('seller_contact', $('contact').value.trim());
localStorage.setItem('seller_telegram', $('telegram').value.trim());
  localStorage.setItem('seller_name', $('seller').value.trim());
  let result;

  if(editing){
    result=await db
      .from('products')
      .update(obj)
      .eq('id',editing)
      .eq('user_id',currentUser.id);
  }else{
    result=await db
      .from('catalog')
      .insert({ name: $('product').value.trim(), image_url: uploadedImageUrl });
  }

  if(result.error){
    message('status',
      'Ошибка: '+result.error.message,true);
    return;
  }

  message(
    'status',
    editing?'Товар изменён':'Товар добавлен'
  );

  resetForm();
  await load();
};

function editRow(id){
  const x=rows.find(r=>String(r.id)===String(id));

  if(!x || !currentUser ||
     x.user_id!==currentUser.id) return;

  editing=x.id;

  $('seller').value=x.seller||'';
  $('product').value=x.product_name||'';
  
  
  
  $('contact').value=x.contact||'';
$('telegram').value=x.telegram||'';
  
  $('formTitle').textContent='Изменить товар';
  $('submit').textContent='Сохранить';
  $('cancel').classList.remove('hidden');

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editing=null;
  $('form').reset();
  const savedContact = localStorage.getItem('seller_contact') || '';
const savedTelegram = localStorage.getItem('seller_telegram') || '';
  const savedSeller = localStorage.getItem('seller_name') || '';
$('seller').value = savedSeller;
$('contact').value = savedContact;
$('telegram').value = savedTelegram;
  $('formTitle').textContent='Добавить товар';
  $('submit').textContent='Добавить товар';
  $('cancel').classList.add('hidden');
}
async function blockSeller(userId){
  if(!currentUser) return;

  if(!confirm('Заблокировать этого продавца?')) return;

  const {error} = await db
    .from('blocked_users')
    .insert({user_id:userId});

  if(error){
    alert('Ошибка: ' + error.message);
    return;
  }

  alert('Продавец заблокирован');
}
async function removeRow(id){
  if(!currentUser) return;

  if(!confirm('Удалить этот товар?')) return;

  const {error}=await db
    .from('products')
    .delete()
    .eq('id',id)
    

  if(error){
    alert('Ошибка: '+error.message);
    return;
  }

  await load();
}

$('cancel').onclick=resetForm;
$('search').oninput=render;
$('refresh').onclick=load;

db.auth.onAuthStateChange(()=>{
  setTimeout(updateAuth,0);
});

(async()=>{
  await updateAuth();
  await load();
  await db.from('site_visits').insert({ page: location.pathname, referrer: document.referrer || null, user_agent: navigator.userAgent });
})();
  async function loadAnalytics() {
  const { count, error } = await db
    .from('site_visits')
    .select('*', { count: 'exact', head: true });

  if (!error) {
    $('analyticsContent').textContent = 'Всего посещений: ' + count;
  }
}
 function toggleSellerPanel(){
  const panel = $('sellerPanel');
  const btn = $('toggleSellerPanel');
  panel.classList.toggle('hidden');
  btn.textContent = panel.classList.contains('hidden')
    ? '➕ Добавить товар'
    : '✖️ Свернуть';
} 
  function showInstallHelp() {
  alert('Чтобы установить MonoFarm на главный экран iPhone:\n\n1. Нажмите кнопку «Поделиться» в Safari\n2. Выберите «На экран Домой»\n3. Нажмите «Добавить»');
}
  $('sellerProfileBtn').onclick = () => {
  $('sellerProfileForm').classList.toggle('hidden');
};
  $('saveSellerProfile').onclick = async () => {
  if (!currentUser) return;

  const { error } = await db.from('seller_profiles').upsert({
    user_id: currentUser.id,
    seller_name: $('profileName').value.trim(),
    contact: $('profileContact').value.trim(),
    telegram: $('profileTelegram').value.trim(),
    updated_at: new Date().toISOString()
  });

  if (error) {
    alert('Ошибка: ' + error.message);
    return;
  }

  alert('Контакты сохранены');
};
  async function toggleStock(catalogId) {
  if (!currentUser) return;

  const exists = (window.sellerStock || []).some(
    s => s.catalog_id === Number(catalogId) &&
         s.seller_id === currentUser.id
  );

  if (exists) {
    const { error } = await db
      .from('seller_stock')
      .delete()
      .eq('catalog_id', catalogId)
      .eq('seller_id', currentUser.id);

    if (error) {
      alert('Ошибка: ' + error.message);
      return;
    }
  } else {
    const { error } = await db
      .from('seller_stock')
      .insert({
        catalog_id: Number(catalogId),
        seller_id: currentUser.id
      });

    if (error) {
      alert('Ошибка: ' + error.message);
      return;
    }
  }

  await load();
}
</script>
<a href="https://t.me/MonoFarmSupports" target="_blank" style="position:fixed;right:20px;bottom:20px;background:#229ED9;color:white;padding:14px 20px;border-radius:30px;text-decoration:none;font-weight:700;z-index:9999;box-shadow:0 4px 15px rgba(0,0,0,.2);">💬 Связь с поддержкой</a>
</body>
</html>
